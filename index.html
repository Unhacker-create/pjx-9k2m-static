<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Visium — Planificador de Ruta</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A4F49">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-512.png">
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
<style>
  :root{
    --ink:#1B2B27;
    --paper:#FAF8F4;
    --teal:#0E6E66;
    --teal-dark:#0A4F49;
    --teal-soft:#DCEEEB;
    --amber:#E08A2B;
    --amber-soft:#FBE9D2;
    --coral:#D1495B;
    --coral-soft:#F6DCE1;
    --line:#E2DCCC;
    --white:#FFFFFF;
    --shadow: 0 2px 10px rgba(27,43,39,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .display{font-family:'Space Grotesk','Inter',sans-serif;}
  .app-shell{
    max-width:600px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--paper);
    position:relative;
  }

  /* ---------- HEADER ---------- */
  .app-header{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(135deg,var(--teal),var(--teal-dark));
    color:var(--white);
    padding:16px 16px 14px;
    box-shadow:var(--shadow);
    transition:padding .18s ease;
  }
  /* Al buscar un cliente para planificar, colapsamos las filas menos
     necesarias del header para dejar hueco a las sugerencias sobre el teclado */
  .app-header.search-focus .brand,
  .app-header.search-focus .header-actions{
    display:none;
  }
  .app-header.search-focus{
    padding-top:8px; padding-bottom:8px;
  }
  .app-header.search-focus .controls{ margin-bottom:0 !important; }
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .brand svg{flex-shrink:0;}
  .brand h1{font-size:1.15rem; font-weight:700; margin:0; letter-spacing:.2px; line-height:1.25;}
  .brand-visium{color:#fff; font-weight:800; letter-spacing:.03em;}
  .header-version{font-size:.72rem; font-weight:600; opacity:.65; letter-spacing:.02em;}
  .brand p{margin:1px 0 0; font-size:.74rem; color:rgba(255,255,255,.78); font-weight:500;}
  .controls{display:flex; flex-wrap:wrap; gap:8px;}
  .field{display:flex; flex-direction:column; gap:3px;}
  .field label{font-size:.62rem; text-transform:uppercase; letter-spacing:.06em; color:rgba(255,255,255,.7); font-weight:600;}
  select, .num-input{
    border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.12);
    color:var(--white);
    border-radius:9px;
    padding:7px 9px;
    font-size:.86rem;
    font-weight:600;
    font-family:inherit;
    -webkit-appearance:none; appearance:none;
  }
  select option{color:var(--ink);}
  .num-input{width:64px;}
  .field.grow{flex:1; min-width:84px;}
  .btn-db{
    margin-left:auto;
    align-self:flex-end;
    border:1px solid rgba(255,255,255,.4);
    background:rgba(255,255,255,.1);
    color:var(--white);
    border-radius:9px;
    padding:7px 11px;
    font-size:.76rem;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn-db:active{background:rgba(255,255,255,.25);}
  .btn-import-route{border-color:rgba(224,138,43,.7) !important; background:rgba(224,138,43,.18) !important;}
  .btn-import-route:active{background:rgba(224,138,43,.35) !important;}
  .btn-reset-top{
    border:1.5px solid rgba(209,73,91,.8);
    background:rgba(209,73,91,.18);
    color:var(--white);
    border-radius:9px;
    padding:6px 12px;
    font-size:.76rem;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
    flex-shrink:0;
    align-self:flex-start;
  }
  .btn-replace-route{
    border:1.5px solid rgba(224,138,43,.9);
    background:rgba(224,138,43,.22);
    color:var(--white);
    border-radius:9px;
    padding:6px 12px;
    font-size:.76rem;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
    flex-shrink:0;
  }
  .btn-replace-route:active{background:rgba(224,138,43,.45);}
  .btn-reset-top:active{background:rgba(209,73,91,.45);}
  .btn-visits{border-color:rgba(79,109,209,.7) !important; background:rgba(79,109,209,.18) !important;}
  .btn-visits:active{background:rgba(79,109,209,.35) !important;}
  .btn-alarm-hdr{
    border-color:rgba(155,37,53,.85) !important;
    background:rgba(155,37,53,.2) !important;
    animation:pulse-alarm 2s infinite;
  }
  .btn-alarm-hdr:active{background:rgba(155,37,53,.4) !important;}
  @keyframes pulse-alarm{
    0%,100%{box-shadow:0 0 0 0 rgba(155,37,53,.45);}
    50%{box-shadow:0 0 0 6px rgba(155,37,53,0);}
  }
  .visits-badge{font-size:.68rem; font-weight:700; color:#fff; background:#4F6DD1; border-radius:5px; padding:1px 7px; margin-left:5px; vertical-align:middle;}

  /* ---------- SUMMARY ---------- */
  .summary-bar{
    padding:10px 16px;
    font-size:.78rem;
    color:#4B5A56;
    background:var(--teal-soft);
    border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap;
  }
  .summary-bar strong{color:var(--teal-dark);}
  .summary-toggle{
    background:none; border:none; color:var(--teal-dark); font-size:.72rem; font-weight:700;
    cursor:pointer; padding:0; white-space:nowrap; display:flex; align-items:center; gap:3px;
    text-decoration:underline; text-underline-offset:2px;
  }
  .summary-toggle .arrow{display:inline-block; transition:transform .2s; font-style:normal;}
  .summary-toggle.open .arrow{transform:rotate(180deg);}

  /* ---------- PANEL PENDIENTES ---------- */
  .pendientes-panel{
    background:var(--white);
    border-bottom:2px solid var(--teal-soft);
    padding:10px 16px 12px;
    display:flex; gap:16px; flex-wrap:wrap;
    animation: slideDown .18s ease;
  }
  .pendientes-panel[hidden]{ display:none !important; }
  @keyframes slideDown{ from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
  .pend-section{flex:1; min-width:140px;}
  .pend-title{font-size:.68rem; font-weight:700; color:var(--teal-dark); text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px;}
  .pend-list{display:flex; flex-direction:column; gap:4px; max-height:160px; overflow-y:auto;}
  .pend-item{
    font-size:.72rem; background:var(--paper); border:1px solid var(--line);
    border-radius:7px; padding:5px 9px; color:var(--ink); line-height:1.3;
  }
  .pend-item.pend-pet{border-left:3px solid var(--coral); color:var(--coral);}
  .pend-item.pend-cli{border-left:3px solid var(--teal); }
  .pend-item.pend-cli-sin{border-left:3px solid #9AA39E; color:#52605C; }
  .pend-item .pend-code{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:.7rem; color:var(--teal-dark); margin-right:5px;}
  .pend-empty{font-size:.72rem; color:#9AA39E; font-style:italic; padding:4px 0;}
  .pend-count{font-size:.6rem; background:var(--coral-soft); color:var(--coral); font-weight:700; border-radius:10px; padding:1px 6px; margin-left:4px;}

  /* ---------- DAY LIST ---------- */
  .day-list{
    flex:1;
    padding:14px 14px 110px;
    overflow-y:auto;
  }
  .empty-state{
    text-align:center;
    padding:40px 20px;
    color:#8A9590;
  }
  .month-sep{
    display:flex;align-items:center;gap:8px;padding:14px 4px 4px;
  }
  .month-sep::before,.month-sep::after{content:'';flex:1;height:1.5px;background:var(--teal-soft);}
  .month-sep span{
    font-family:'Space Grotesk',sans-serif;font-size:.72rem;font-weight:700;
    letter-spacing:.07em;color:var(--teal-dark);background:var(--teal-soft);
    padding:3px 12px;border-radius:12px;white-space:nowrap;
  }
  .day-card{display:flex; gap:10px; align-items:stretch;}
  .node-col{width:18px; display:flex; flex-direction:column; align-items:center; flex-shrink:0;}
  .node-dot{width:13px; height:13px; border-radius:50%; background:var(--line); margin-top:16px; flex-shrink:0; transition:background .15s;}
  .day-card.has-visits .node-dot{background:var(--teal);}
  .day-card.is-festivo .node-dot{background:transparent; border:2px dashed #B9C2BD; width:9px; height:9px;}
  .node-line{flex:1; width:2px; background:var(--line); margin:2px 0;}
  .day-card:last-child .node-line{display:none;}

  .day-body{flex:1; min-width:0; padding-bottom:16px;}
  .day-head{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
  .day-date{display:flex; align-items:baseline; gap:5px; font-family:'Space Grotesk',sans-serif;}
  .day-date .dow{font-size:.68rem; font-weight:700; letter-spacing:.05em; color:var(--teal-dark); background:var(--teal-soft); padding:2px 6px; border-radius:5px;}
  .day-date .num{font-size:1.15rem; font-weight:700;}
  .day-date .mon{font-size:.68rem; color:#8A9590; text-transform:uppercase;}
  .day-card.is-festivo .day-date .dow{background:var(--coral-soft); color:var(--coral);}
  .day-card.is-festivo .day-body{opacity:.55;}

  .festivo-toggle{
    margin-left:auto;
    display:flex; align-items:center; gap:4px;
    font-size:.68rem; color:#8A9590; font-weight:600;
    cursor:pointer; user-select:none;
    white-space:nowrap;
  }
  .festivo-toggle input{accent-color:var(--coral); width:14px; height:14px; cursor:pointer;}

  .client-chips{list-style:none; margin:0 0 8px; padding:0; display:flex; flex-direction:column; gap:6px;}
  .chip{
    display:flex; align-items:center; gap:8px;
    background:var(--white); border:1px solid var(--line); border-radius:9px;
    padding:7px 8px 7px 10px;
  }
  .chip-main{flex:1; min-width:0;}
  .chip-code{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:.92rem; color:var(--teal-dark);}
  .chip-manual-tag{font-size:.6rem; font-weight:700; color:var(--amber); margin-left:5px; text-transform:uppercase;}
  .chip-name{font-size:.82rem; color:#52605C; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .chip-remove{
    flex-shrink:0; border:none; background:none; color:#B9C2BD; font-size:1.05rem;
    width:24px; height:24px; border-radius:50%; cursor:pointer; line-height:1;
  }
  .chip-remove:active{background:var(--coral-soft); color:var(--coral);}

  .btn-add-client{
    border:1.5px dashed #C7CFC9; background:transparent; color:var(--teal-dark);
    border-radius:9px; padding:8px 10px; font-size:.78rem; font-weight:600;
    cursor:pointer; width:100%; text-align:left;
  }
  .btn-add-client:active{background:var(--teal-soft);}
  .day-card.is-festivo .btn-add-client{display:none;}

  .add-panel{
    margin-top:8px; background:var(--white); border:1px solid var(--line); border-radius:11px;
    padding:10px; box-shadow:var(--shadow);
  }
  .add-panel input[type="text"]{
    width:100%; border:1px solid var(--line); border-radius:8px; padding:9px 10px;
    font-size:.85rem; font-family:inherit; color:var(--ink); margin-bottom:7px;
  }
  .add-panel input[type="text"]:focus{outline:2px solid var(--teal); outline-offset:1px;}
  .scope-toggle{display:flex; align-items:center; gap:5px; font-size:.7rem; color:#6B7873; margin-bottom:7px; cursor:pointer; user-select:none;}
  .scope-toggle input{accent-color:var(--teal);}

  .suggestions{list-style:none; margin:0 0 6px; padding:0; max-height:52vh; overflow-y:auto;}
  .sugg-item{
    display:flex; align-items:center; gap:8px; padding:8px 6px; border-radius:7px; cursor:pointer;
  }
  .sugg-item:active, .sugg-item.kbd-active{background:var(--teal-soft);}
  .sugg-item + .sugg-item{border-top:1px solid #F0EEE6;}
  .sugg-code{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:.88rem; color:var(--teal-dark); flex-shrink:0;}
  .sugg-info{flex:1; min-width:0;}
  .sugg-name{font-size:.82rem; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .sugg-meta{font-size:.65rem; color:#9AA39E;}
  .sugg-freq{font-size:.6rem; font-weight:700; color:var(--amber); background:var(--amber-soft); padding:1px 5px; border-radius:5px; flex-shrink:0;}
  .sugg-pets{margin-top:4px; display:flex; flex-wrap:wrap; gap:3px;}
  .sugg-pet-tag{font-size:.6rem; font-weight:600; color:var(--teal-dark); background:var(--teal-soft); border-radius:4px; padding:2px 6px; line-height:1.3;}
  .chip-pets{margin-top:4px; display:flex; flex-direction:column; gap:2px;}
  .chip-pet{font-size:.66rem; color:var(--teal-dark); background:var(--teal-soft); border-radius:4px; padding:2px 6px; display:inline-block;}
  .chip-map{font-size:.7rem; color:#1B6E8A; text-decoration:none; display:inline-block; margin-top:4px; font-weight:600;}
  .chip-map:active{opacity:.6;}
  .route-map-modal{
    display:none; position:fixed; inset:0; z-index:9999;
    background:#0A4F49; flex-direction:column;
  }
  .route-map-modal.open{ display:flex; }
  .route-map-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; color:#fff; font-weight:700; font-family:'Space Grotesk',sans-serif;
  }
  .route-map-header button{
    background:rgba(255,255,255,.15); border:none; color:#fff; border-radius:8px;
    width:32px; height:32px; font-size:1rem; cursor:pointer;
  }
  .route-map-status{ padding:0 16px 10px; color:#CFEAE4; font-size:.8rem; min-height:18px; }
  .route-map-div{ flex:1; background:#e8e8e8; }
  .route-map-footer{ padding:10px 16px; color:#CFEAE4; font-size:.68rem; text-align:center; }
  .rm-pin-popup{ font-family:'Inter',sans-serif; font-size:.8rem; }
  .rm-pin-popup b{ display:block; margin-bottom:2px; }
  .no-results{font-size:.76rem; color:#9AA39E; padding:8px 4px;}

  .btn-manual{
    width:100%; text-align:center; background:none; border:none; color:#8A9590;
    font-size:.7rem; font-weight:600; text-decoration:underline; cursor:pointer; padding:6px 0 2px;
  }
  .manual-form{margin-top:8px; padding-top:8px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:6px;}
  .manual-form input{border:1px solid var(--line); border-radius:8px; padding:8px 9px; font-size:.8rem; font-family:inherit;}
  .manual-form .btn-confirm-manual{
    background:var(--teal); color:var(--white); border:none; border-radius:8px; padding:9px; font-weight:700; font-size:.78rem; cursor:pointer;
  }

  .add-panel-footer{display:flex; justify-content:flex-end; margin-top:4px;}
  .btn-done{
    background:var(--teal-soft); color:var(--teal-dark); border:none; border-radius:8px;
    padding:7px 14px; font-size:.76rem; font-weight:700; cursor:pointer;
  }

  /* ---------- FOOTER ---------- */
  .action-bar{
    position:sticky; bottom:0; z-index:20;
    background:var(--white); border-top:1px solid var(--line);
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    display:grid; grid-template-columns:repeat(2, 1fr); gap:7px;
    box-shadow:0 -2px 10px rgba(27,43,39,.06);
  }
  .saved-indicator{
    grid-column:1 / -1; justify-self:center;
    font-size:.75rem; font-weight:600; color:var(--teal-dark);
    background:var(--teal-soft); border-radius:7px; padding:5px 10px;
    opacity:0; transform:translateY(4px);
    transition:opacity .25s, transform .25s;
    white-space:nowrap; pointer-events:none;
  }
  .saved-indicator.visible{ opacity:1; transform:translateY(0); }
  .btn-primary, .btn-secondary{
    min-width:0; border:none; border-radius:11px; padding:9px 4px; font-size:.72rem; font-weight:700;
    cursor:pointer; font-family:inherit; display:flex; align-items:center; justify-content:center; gap:4px;
    white-space:normal; line-height:1.15; text-align:center;
  }
  .btn-primary{background:var(--teal); color:var(--white);}
  .btn-primary:active{background:var(--teal-dark);}
  .btn-secondary{background:var(--paper); color:var(--teal-dark); border:1.5px solid var(--teal-soft);}
  .btn-secondary:active{background:var(--teal-soft);}

  /* ---------- TOAST ---------- */
  .toast{
    position:fixed; left:50%; bottom:86px; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--white); padding:10px 16px; border-radius:9px;
    font-size:.8rem; font-weight:500; box-shadow:var(--shadow); z-index:60;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; max-width:86%; text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ---------- MODAL ALARMAS F2-F3-F4 ---------- */
  .alarm-overlay{
    position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:800;
    background:rgba(27,43,39,.55);display:flex;align-items:center;justify-content:center;
    padding:16px;box-sizing:border-box;
  }
  .alarm-modal{
    background:var(--white);border-radius:16px;width:100%;max-width:560px;
    max-height:85vh;display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 8px 40px rgba(27,43,39,.25);
  }
  .alarm-header{
    background:linear-gradient(135deg,#C05020,#9B2535);
    color:#fff;padding:16px 18px;display:flex;align-items:center;gap:10px;
    flex-shrink:0;
  }
  .alarm-header h2{margin:0;font-size:1rem;font-family:'Space Grotesk',sans-serif;}
  .alarm-header p{margin:2px 0 0;font-size:.75rem;opacity:.85;}
  .alarm-close{margin-left:auto;background:rgba(255,255,255,.15);border:none;color:#fff;
    border-radius:8px;padding:6px 10px;font-size:.8rem;font-weight:700;cursor:pointer;flex-shrink:0;}
  .alarm-close:active{background:rgba(255,255,255,.3);}
  .alarm-body{overflow-y:auto;padding:14px 16px 16px;flex:1;}
  .alarm-ruta-block{margin-bottom:14px;}
  .alarm-ruta-title{
    font-size:.7rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
    color:var(--teal-dark);background:var(--teal-soft);border-radius:6px;
    padding:4px 10px;margin-bottom:6px;display:flex;justify-content:space-between;
  }
  .alarm-badge{background:#C05020;color:#fff;border-radius:10px;padding:1px 7px;font-size:.65rem;}
  .alarm-item{
    display:flex;align-items:center;gap:8px;padding:6px 8px;
    border-radius:8px;border:1px solid var(--line);margin-bottom:4px;background:var(--paper);
  }
  .alarm-freq{
    font-size:.65rem;font-weight:700;color:#fff;border-radius:5px;padding:2px 6px;flex-shrink:0;
  }
  .alarm-freq.f2{background:#E08A2B;}
  .alarm-freq.f3{background:#C05020;}
  .alarm-freq.f4{background:#9B2535;}
  .alarm-info{flex:1;min-width:0;}
  .alarm-code{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:.76rem;color:var(--teal-dark);}
  .alarm-name{font-size:.72rem;color:#52605C;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .alarm-footer{
    padding:10px 16px;border-top:1px solid var(--line);background:var(--paper);
    display:flex;justify-content:space-between;align-items:center;flex-shrink:0;
  }
  .alarm-footer-note{font-size:.72rem;color:#8A9590;}
  .btn-alarm-ok{
    background:var(--teal);color:#fff;border:none;border-radius:9px;
    padding:9px 20px;font-weight:700;font-size:.82rem;cursor:pointer;
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>

<div class="app-shell">

  <header class="app-header">
    <!-- Fila 1: marca + acciones peligrosas -->
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
        <circle cx="7" cy="6" r="3.4" fill="#fff"/>
        <circle cx="7" cy="15" r="3.4" fill="#fff" opacity=".85"/>
        <circle cx="7" cy="24" r="3.4" fill="#fff" opacity=".6"/>
        <path d="M7 9.5V21.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        <path d="M12 6H22a4 4 0 0 1 4 4v0a4 4 0 0 1-4 4H12" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none" opacity=".9"/>
      </svg>
      <div style="flex:1">
